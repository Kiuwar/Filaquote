name: Release

# Publica o instalador do Windows no GitHub Releases quando uma tag vX.Y.Z é enviada.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Instalador Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Testes antes de publicar
        run: pnpm test
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: Filaquote ${{ github.ref_name }}
          releaseBody: |
            Instalador para Windows 10 e 11: baixe o arquivo `Filaquote_*_x64-setup.exe` abaixo.

            O instalador não tem assinatura de código, então o Windows pode mostrar o aviso do SmartScreen
            ("O Windows protegeu o computador"). Para instalar: **Mais informações → Executar assim mesmo**.

            Novidades: veja o CHANGELOG.md.
          releaseDraft: false
          prerelease: false
